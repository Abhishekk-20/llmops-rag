apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: llmops
data:
  prometheus.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: llmops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: llmops
spec:
  replicas: 1
  strategy:
    type: Recreate  

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20

          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin

            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: admin-password

            - name: GF_PATHS_PERMITTED_PROVISIONING_PATHS
              value: "/etc/grafana/provisioning"

          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana

            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources/prometheus.yml
              subPath: prometheus.yml

            - name: dashboards
              mountPath: /etc/grafana/provisioning/llmops/lmops-rag-k8s.json
              subPath: lmops-rag-k8s.json
              readOnly: true

      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-pvc

        - name: datasource
          configMap:
            name: grafana-datasource

        - name: dashboards
          configMap:
            name: grafana-dashboard

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: llmops
spec:
  selector:
    app: grafana

  ports:
    - name: http
      port: 3000
      targetPort: 3000

  type: ClusterIP
